appId: com.md2wechatmp.app
productName: 排版助手
copyright: 排版助手
directories:
  buildResources: build
  output: dist
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - '!out/**/*.map'
  - package.json
# Chromium 界面语言只保留中文与英语；不裁剪 ICU、字体或媒体解码能力。
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
# 转换进程的入口不放进 asar：utilityProcess.fork 需要真实文件路径，
# 拆包后路径不变（Electron 会自动重定向到 app.asar.unpacked）。
asarUnpack:
  - out/main/worker/**/*
npmRebuild: false
forceCodeSigning: false
publish: null
artifactName: ${name}-${version}-${os}-${arch}.${ext}
win:
  icon: build/icon.ico
  signExecutable: false
  target:
    - nsis
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
dmg:
  sign: false
linux:
  icon: build/icons
  category: Office
  # AppImage 依赖 libfuse2、无法上架麒麟/统信应用商店，只出 deb 安装包。
  # 注意不要再加 tar.gz / AppImage：它们与 deb 并发做 xz、7z 极限压缩，会让打包时间翻倍。
  # 需要免安装运行请用 build.py --dir 生成应用目录。
  target:
    - deb
  # deb 的 Maintainer 字段必填，替换为真实维护者邮箱即可。
  maintainer: md2wechatmp <md2wechatmp@users.noreply.github.com>
  # 可执行文件名使用 ASCII，避免中文路径在国产系统的终端、桌面文件和服务脚本中出问题；
  # 桌面菜单仍显示 productName「排版助手」。
  executableName: md2wechatmp
  # 让 .desktop 文件名取自 package.json 的 desktopName，与 Electron 的 app_id / WM_CLASS 一致，
  # 否则 UKUI、DDE 等桌面可能无法把运行中的窗口归到菜单项。
  syncDesktopName: true
deb:
  packageCategory: office
  priority: optional
nsis:
  # 当前不使用 electron-updater；完整安装包可采用更紧凑的 solid 7z 压缩。
  differentialPackage: false
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: 排版助手
