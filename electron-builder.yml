appId: com.md2wechatmp.app
productName: 排版助手
copyright: 排版助手
directories:
  buildResources: build
  output: dist
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - '!out/**/*.map'
  - package.json
# Chromium 界面语言只保留中文与英语；不裁剪 ICU、字体或媒体解码能力。
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
# 转换进程的入口不放进 asar：utilityProcess.fork 需要真实文件路径，
# 拆包后路径不变（Electron 会自动重定向到 app.asar.unpacked）。
asarUnpack:
  - out/main/worker/**/*
npmRebuild: false
forceCodeSigning: false
publish: null
artifactName: ${name}-${version}-${os}-${arch}.${ext}
win:
  icon: build/icon.ico
  signExecutable: false
  target:
    - nsis
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
dmg:
  sign: false
linux:
  icon: build/icons
  category: Office
  target:
    - AppImage
    - tar.gz
nsis:
  # 当前不使用 electron-updater；完整安装包可采用更紧凑的 solid 7z 压缩。
  differentialPackage: false
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: 排版助手
